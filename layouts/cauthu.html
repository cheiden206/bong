<section class="all-players-page">
    <div class="filter-header" style="margin-bottom: 30px;">
        <div class="filter-title" style="display: flex; align-items: center; gap: 12px;">
            <span class="decor-bar" style="width: 6px; height: 32px; background-color: #2b5cff; border-radius: 4px;"></span>
            <h2 style="font-size: 28px; color: #111; font-weight: 700; margin: 0;">Danh Sách Cầu Thủ Theo Vị Trí</h2>
        </div>
    </div>

    <!-- Container chứa các nhóm vị trí -->
    <div class="squad-positions-container">
        
        <!-- 1. THỦ MÔN (GK) -->
        <div class="position-group-box">
            <div class="position-title">
                <span class="pos-bar gk-bar"></span>
                <h3>Thủ Môn (GK)</h3>
            </div>
            <div id="all-list-gk" class="player-cards-grid">
            </div>
        </div>

        <!-- 2. HẬU VỆ (DF) -->
        <div class="position-group-box">
            <div class="position-title">
                <span class="pos-bar df-bar"></span>
                <h3>Hậu Vệ (DF)</h3>
            </div>
            <div id="all-list-df" class="player-cards-grid">
            </div>
        </div>

        <!-- 3. TIỀN VỆ (MF) -->
        <div class="position-group-box">
            <div class="position-title">
                <span class="pos-bar mf-bar"></span>
                <h3>Tiền Vệ (MF)</h3>
            </div>
            <div id="all-list-mf" class="player-cards-grid">
            </div>
        </div>

        <!-- 4. TIỀN ĐẠO (FW) -->
        <div class="position-group-box">
            <div class="position-title">
                <span class="pos-bar fw-bar"></span>
                <h3>Tiền Đạo (FW)</h3>
            </div>
            <div id="all-list-fw" class="player-cards-grid">
            </div>
        </div>

    </div>
</section>
